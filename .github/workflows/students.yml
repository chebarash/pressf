name: Student sync and reminders

# Backup only: the web server runs these jobs itself (src/server/scheduler.ts:
# reminders every minute, student sync every five). GitHub's schedule is
# unreliable, so this only nudges the same routes every 30 minutes; the routes
# share the server's advisory locks, so a nudge never doubles a running job.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: student-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reminders (digest, class soon, deadlines, rating ask)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
      - name: Sync the students synced longest ago
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 70 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/students?limit=25"
