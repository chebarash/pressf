name: Student sync and reminders

# Keeps every student's LMS data fresh in the background (pages never call the
# LMS) and sends the bot reminders. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: student-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reminders (digest, class soon, deadlines, rating ask)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
      - name: Sync the students synced longest ago
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 70 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/students?limit=25"
