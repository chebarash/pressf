name: Weekly LMS harvest

# The university catalog changes at most once a term, so once a week is plenty.
# Walking the LMS subject ids takes a few minutes, hence the long timeout.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Harvest the LMS catalog into the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        # A deploy restarts the site for a minute (502/503): wait and try again, up to 4 times.
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl --silent --show-error --max-time 900 -o body.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/harvest" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            case "$code" in 502|503|504|000) sleep 90 ;; *) break ;; esac
          done
          echo "BODY: $(cat body.txt 2>/dev/null)"
          test "$code" = "200"
