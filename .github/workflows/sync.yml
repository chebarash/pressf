name: Nightly sync

# Copies Anonymous channel posts and matches them to courses and professors (while MENTIONS_SYNC=on). The bot rebuilds its data at 02:00 UTC for about 7 minutes.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Anonymous posts into the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          result=$(curl --fail --silent --show-error --retry 3 --retry-delay 90 --retry-all-errors --max-time 280 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync")
          echo "$result"
          test "$(echo "$result" | jq '.failed | length')" = 0
